name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest -q

      - name: Run deterministic offline evaluation
        run: python scripts/evaluate.py

      - name: Scan tracked files for secrets
        run: python scripts/scan_secrets.py .

      - name: Smoke test Streamlit without secrets
        env:
          TUSHARE_TOKEN: ""
          DEEPSEEK_API_KEY: ""
        run: |
          set -euo pipefail
          python -m streamlit run app.py \
            --server.headless=true \
            --server.address=127.0.0.1 \
            --server.port=8501 \
            >/tmp/streamlit.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          deadline=$((SECONDS + 20))
          while (( SECONDS < deadline )); do
            if curl --fail --silent --show-error --max-time 1 \
              http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              sed -n '1,120p' /tmp/streamlit.log
              exit 1
            fi
            sleep 1
          done

          sed -n '1,120p' /tmp/streamlit.log
          exit 1
